<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATLAS · 认知图谱</title>
  <link rel="stylesheet" href="/theme.css">
  <script defer src="/js/vendor/cytoscape.js"></script>
  <script defer src="/js/vendor/layout-base.js"></script>
  <script defer src="/js/vendor/cose-base.js"></script>
  <script defer src="/js/vendor/cytoscape-fcose.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <aside class="sidebar">
    <a class="brand" href="#/home">ATLAS<span>个人认知图谱</span></a>
    <label class="search-label" for="search">搜索人物、主题与判断</label>
    <div class="search-box"><input id="search" type="search" autocomplete="off" placeholder="搜索…"><kbd>Ctrl K /</kbd></div>
    <div id="search-results" aria-live="polite"></div>
    <nav class="primary" aria-label="视图"><a href="#/home">概览 <span>01</span></a><a href="#/lines">判断线 <span>02</span></a><a href="#/entities">实体 <span>03</span></a></nav>
    <p class="section-label">判断线目录</p><nav id="toc" class="toc" aria-label="判断线目录"></nav>
    <p class="sidebar-note">沿着时间理解判断，<br>回到证据核对来源。</p>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>ATLAS <span class="separator">/</span> <span id="crumb">概览</span></span><div class="tools"><label><input id="sensitive" type="checkbox"> 显示敏感内容</label><button id="theme" type="button" aria-label="切换深色主题">深色</button></div></header>
    <main id="content" tabindex="-1" aria-live="polite"></main>
    <footer>本地只读 · 判断来自记录，核对回到原文</footer>
  </div>
  <dialog id="evidence" aria-label="证据原文"><div class="drawer-head"><div><span class="eyebrow">回到来源</span><h2>证据</h2></div><button id="close-evidence" aria-label="关闭证据">关闭 ×</button></div><div id="evidence-body"></div></dialog>
  <noscript>请启用 JavaScript 以读取本地数据库。</noscript>
</body>
</html>
